version: '3.8'

services:
  corenotificacion-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corenotificacion-api
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TZ=America/Bogota
      - JAVA_OPTS=-Xms256m -Xmx512m
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
